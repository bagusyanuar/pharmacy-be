# Config file for [Air](https://github.com/air-verse/air) in TOML format

# Working directory
root = "."
tmp_dir = "tmp"

[build]
# Build command pointing to cmd/api entrypoint
cmd = "go build -o ./tmp/main ./cmd/api"
# Binary file yields from `cmd`.
bin = "tmp/main"
# Customize binary execution
full_bin = "./tmp/main"
# Watch these filename extensions.
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]
# Ignore these filename extensions or directories.
exclude_dir = ["assets", "tmp", "vendor", "testdata", "storage", "graphify-out", ".agents", "docs/knowledge", "bin"]
# Watch these directories.
include_dir = ["cmd", "internal", "pkg", "docs"]
# Watch these files.
include_file = [".env"]
# Exclude files.
exclude_file = []
# Exclude specific regular expressions.
exclude_regex = ["_test\\.go$"]
# Exclude unchanged files.
exclude_unchanged = true
# Follow symlink for directories
follow_symlink = false
# This log file places in your tmp_dir.
log = "air.log"
# Poll files for changes instead of using fsnotify.
poll = false
# Poll interval (defaults to 0 ms).
poll_interval = 0
# Delay after each build (in ms).
delay = 500
# Stop running old binary when build errors occur.
stop_on_error = true
# Send Interrupt signal before killing process (Fiber v3 graceful shutdown)
send_interrupt = true
# Delay after sending Interrupt signal
kill_delay = 500
# Rerun binary or not
rerun = false
# Delay after each execution
rerun_delay = 500

[log]
# Show log time
time = false
# Only show main log (silences watcher, build, runner)
main_only = false

[color]
# Customize each part's color. If no color found, use the raw app log.
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
# Delete tmp directory on exit
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
